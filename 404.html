<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Biblioteca Abierta</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <style>
    /* Página centrada con la misma paleta que el explorador. */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: #fbf9f5;
      color: #1c1917;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    /* Caja de texto y botón de regreso. */
    .caja { max-width: 34rem; }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1.1;
      margin-bottom: .6rem;
    }
    p { color: #57534e; margin-bottom: 1.2rem; }
    .button { background: #1f4e46; border-color: #1f4e46; color: #fff; font-weight: 600; }
    .button:hover { background: #173a34; color: #fff; }
  </style>
</head>
<body>
  <div class="caja">
    <p class="is-size-7 has-text-weight-bold" style="letter-spacing:.22em;">BIBLIOTECA ABIERTA</p>
    <h1>Esta página no existe</h1>
    <p>
      La dirección que abriste no forma parte del explorador de libros.
      Vuelve al inicio para buscar en la colección de Open Library.
    </p>
    <!-- Ruta relativa: funciona igual en usuario.github.io/repositorio/ -->
    <a class="button" href="./">Volver al explorador</a>
  </div>
</body>
</html>
